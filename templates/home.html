<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>TeamDev — Welcome</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#17213b 0,transparent 45%),radial-gradient(ellipse at 85% 90%,#14243a 0,transparent 40%),#080b14;color:#edf3ff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,620px);padding:clamp(28px,6vw,56px);border:1px solid #27334b;border-radius:24px;background:#101726eF;box-shadow:0 28px 90px #0008;text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 24px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#14c9e8,#7865f5);font-size:27px;font-weight:800;color:#07101b}
    h1{margin:0;font-size:clamp(32px,7vw,48px);letter-spacing:-1.5px}p{max-width:430px;margin:16px auto 30px;color:#aab8d0;line-height:1.7}
    nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a{min-width:140px;padding:13px 22px;border:1px solid #34435f;border-radius:12px;color:#edf3ff;text-decoration:none;font-weight:700;transition:transform .2s,border-color .2s}a.primary{border-color:transparent;background:linear-gradient(110deg,#13bcd8,#7865f5)}a:hover{transform:translateY(-2px);border-color:#55d8ee}
    small{display:block;margin-top:34px;color:#71819d}
  </style>
</head>
<body>
  <main>
    <div class="mark">T</div>
    <h1>Welcome to TeamDev</h1>
    <p>A simple, secure place to manage your links and access your dashboard.</p>
    <nav aria-label="Account">
      <a class="primary" href="/login">Log in</a>
      <a href="/sign-up">Sign up</a>
    </nav>
    <small>© TeamDev</small>
  </main>
</body>
</html>
