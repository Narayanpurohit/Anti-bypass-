<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Anti Bypass</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 10%,#17213b,transparent 45%),#080b14;color:#edf3ff;font:15px system-ui}.card{width:min(100%,420px);padding:32px;border:1px solid #27334b;border-radius:22px;background:#101726;box-shadow:0 28px 90px #0008}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#14c9e8,#7865f5);color:#07101b;font-weight:900;font-size:23px}h1{margin:22px 0 5px;font-size:29px}.sub{color:#9cabc4;line-height:1.6;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-size:12px;color:#aab8d0}.field input{width:100%;padding:13px;border:1px solid #2b3852;border-radius:10px;background:#0b1220;color:white;font:inherit;outline:none}.field input:focus{border-color:#17c8e4}button{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(110deg,#13bcd8,#7865f5);color:white;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}.err{color:#ff7187;min-height:20px;margin-top:12px;font-size:13px}.links{display:flex;justify-content:space-between;margin-top:22px;font-size:13px}.links a{color:#61d9ed;text-decoration:none}.foot{margin-top:24px;color:#687995;font-size:12px;text-align:center}</style></head><body><main class="card"><div class="mark">AB</div><h1>Welcome back</h1><p class="sub">Log in to manage your Anti Bypass links, analytics and settings.</p><form onsubmit="login(event)"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><button id="btn">Log In</button></form><div id="err" class="err"></div><div class="links"><a href="/">← Home</a><a href="/sign-up">Sign up</a></div><div class="foot">Anti Bypass · Secure link management</div></main><script>async function login(ev){ev.preventDefault();const b=document.getElementById('btn'),err=document.getElementById('err');b.disabled=true;b.textContent='Signing in...';err.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');location.href='/dashboard'}catch(e){err.textContent=e.message;b.disabled=false;b.textContent='Log In'}}</script></body></html>
